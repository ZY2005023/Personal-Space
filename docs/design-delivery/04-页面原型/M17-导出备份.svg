<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><title>M17-导出备份</title><rect x="0" y="0" width="390" height="1040" rx="0" fill="#F7F6F2"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#FFFFFF"/><line x1="20" y1="24" x2="40" y2="24" stroke="#252D2B" stroke-width="2"/><line x1="20" y1="31" x2="40" y2="31" stroke="#252D2B" stroke-width="2"/><line x1="20" y1="38" x2="40" y2="38" stroke="#252D2B" stroke-width="2"/><text x="64" y="20" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="700">导出与备份</text><line x1="0" y1="64" x2="390" y2="64" stroke="#DADDD5" stroke-width="1"/><text x="20" y="110" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#252D2B" font-weight="700">导出与备份</text><text x="20" y="164" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#646D68" font-weight="400">保护文字，也保护图片与历史。</text><rect x="20" y="214" width="134" height="44" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="36" y="225" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">创建导出</text><rect x="174" y="214" width="134" height="44" rx="6" fill="#245744"/><text x="190" y="225" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400">手动备份</text><rect x="20" y="308" width="350" height="276" rx="8" fill="#FFFFFF" stroke="#DADDD5"/><text x="40" y="330" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#252D2B" font-weight="700">最近一次备份</text><text x="40" y="378" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#646D68" font-weight="400">2026.11.02  03:00</text><text x="40" y="430" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">本地备份</text><text x="270" y="430" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#245744" font-weight="700">成功</text><text x="40" y="474" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">完整性校验</text><text x="270" y="474" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#245744" font-weight="700">成功</text><text x="40" y="518" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">异地副本</text><text x="270" y="518" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#A3372D" font-weight="700">失败</text><text x="20" y="620" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#A3372D" font-weight="400">异地副本失败，完整保护尚未达标。请查看任务错误</text><text x="20" y="649" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#A3372D" font-weight="400">并重新处理。</text><text x="20" y="736" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#252D2B" font-weight="700">恢复演练</text><text x="20" y="782" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">首次公网发布前及每三个月进行完整恢复演练。文件</text><text x="20" y="811" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">校验不等于恢复验证。</text></svg>