<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><title>M03-文章阅读</title><rect x="0" y="0" width="390" height="1040" rx="0" fill="#F7F6F2"/><text x="24" y="22" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#252D2B" font-weight="700">Personal Space</text><text x="322" y="24" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">菜单</text><line x1="24" y1="72" x2="366" y2="72" stroke="#DADDD5" stroke-width="1"/><rect x="0" y="0" width="163.79999999999998" height="3" rx="0" fill="#245744"/><text x="24" y="114" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#245744" font-weight="400">知识 / 阅读方法</text><text x="24" y="157" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#252D2B" font-weight="700">如何建立可回访的笔记</text><text x="24" y="219" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#646D68" font-weight="400">2026.11.02  ·  阅读 6 分钟</text><rect x="24" y="269" width="342" height="48" rx="6" fill="#E7EDE6"/><text x="40" y="284" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">本篇目录                         展开 ＋</text><text x="24" y="352" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#252D2B" font-weight="700">从记录到连接</text><text x="24" y="416" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="400">记录不是为了把每一件事保存下来，而是为下</text><text x="24" y="450" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="400">一次思考留一个入口。一条笔记可以很短，只</text><text x="24" y="484" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="400">要它能让未来的自己找到当时的问题。</text><text x="24" y="548" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="400">当两条原本独立的记录产生联系，知识就不再</text><text x="24" y="582" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="400">是一份静止的清单。我们可以从熟悉的问题出</text><text x="24" y="616" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="400">发，一点点扩展自己的理解。</text><rect x="24" y="674" width="342" height="108" rx="6" fill="#E7EDE6"/><text x="44" y="694" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#245744" font-weight="400">先写下自己的问题，再决定需要保留什</text><text x="44" y="726" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#245744" font-weight="400">么。</text><text x="24" y="824" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#252D2B" font-weight="700">留下自己的问题</text><text x="24" y="886" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="400">每次回访时，允许笔记继续改变。新的经验也</text><text x="24" y="920" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="400">会让旧的问题有不同的答案。</text></svg>