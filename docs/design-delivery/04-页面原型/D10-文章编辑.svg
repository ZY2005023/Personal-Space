<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040"><title>D10-文章编辑</title><rect x="0" y="0" width="1440" height="1040" rx="0" fill="#F7F6F2"/><rect x="0" y="0" width="224" height="1040" rx="0" fill="#FFFFFF"/><text x="24" y="30" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#252D2B" font-weight="700">Personal Space</text><text x="24" y="62" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#646D68" font-weight="400">管理空间</text><text x="28" y="126" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">概览</text><rect x="12" y="175" width="200" height="44" rx="6" fill="#E7EDE6"/><text x="28" y="181" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#245744" font-weight="700">内容管理</text><text x="28" y="236" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">媒体库</text><text x="28" y="291" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">分类与标签</text><text x="28" y="346" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">回收站</text><text x="28" y="401" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">导出与备份</text><text x="28" y="456" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">安全与设置</text><text x="28" y="511" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">审计记录</text><text x="24" y="976" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#646D68" font-weight="400">管理员 · 安全会话</text><text x="264" y="28" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#252D2B" font-weight="700">内容管理</text><text x="1190" y="32" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#646D68" font-weight="400">查看网站   退出</text><line x1="224" y1="80" x2="1440" y2="80" stroke="#DADDD5" stroke-width="1"/><text x="264" y="114" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#252D2B" font-weight="700">如何建立可回访的笔记</text><text x="264" y="166" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#646D68" font-weight="400">已保存 17:36 · 草稿版本 8 · 线上第 2 版</text><rect x="982" y="114" width="112" height="44" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="998" y="125" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">发布设置</text><rect x="1110" y="114" width="112" height="44" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="1126" y="125" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">保存草稿</text><rect x="1238" y="114" width="112" height="44" rx="6" fill="#245744"/><text x="1254" y="125" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400">确认发布</text><rect x="264" y="222" width="530" height="710" rx="8" fill="#FFFFFF" stroke="#DADDD5"/><rect x="814" y="222" width="550" height="710" rx="8" fill="#FFFFFF" stroke="#DADDD5"/><text x="284" y="244" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="700">Markdown 编辑</text><text x="838" y="244" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="700">实时预览</text><line x1="284" y1="288" x2="774" y2="288" stroke="#DADDD5" stroke-width="1"/><line x1="838" y1="288" x2="1340" y2="288" stroke="#DADDD5" stroke-width="1"/><text x="284" y="320" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#245744" font-weight="400">## 从记录到连接</text><text x="284" y="378" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#252D2B" font-weight="400">记录不是为了把每一件事保存下来，而是为下一次思考留一个入口。</text><text x="838" y="316" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#252D2B" font-weight="700">从记录到连接</text><text x="838" y="378" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="400">记录不是为了把每一件事保存下来，而是为下一次思考留一个入口。</text><rect x="838" y="542" width="498" height="116" rx="6" fill="#E7EDE6"/><text x="858" y="566" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#245744" font-weight="400">先写下自己的问题，再决定需要保留什么。</text></svg>