<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>M21-保存冲突</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#F7F6F2"/><text x="24" y="22" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#252D2B" font-weight="700">Personal Space</text><text x="322" y="24" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">菜单</text><line x1="24" y1="72" x2="366" y2="72" stroke="#DADDD5" stroke-width="1"/><text x="24" y="210" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#252D2B" font-weight="700">草稿已在另一处更新</text><text x="24" y="286" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#646D68" font-weight="400">你的输入仍然保留。请比较差异或复制当前内容，</text><text x="24" y="316" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#646D68" font-weight="400">再载入服务器版本。</text><rect x="24" y="430" width="170" height="44" rx="6" fill="#245744"/><text x="40" y="441" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400">比较差异</text><rect x="24" y="494" width="170" height="44" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="40" y="505" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">复制本地内容</text><text x="24" y="580" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#A3372D" font-weight="400">不会无条件覆盖服务器草稿。</text></svg>