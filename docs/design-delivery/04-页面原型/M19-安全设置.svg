eline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#245744" font-weight="400">有效</text><line x1="20" y1="464" x2="370" y2="464" stroke="#DADDD5" stroke-width="1"/><rect x="20" y="548" width="166" height="44" rx="6" fill="#245744"/><text x="36" y="559" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400">管理认证安全</text><text x="20" y="616" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#646D68" font-weight="400">修改密码、MFA 或重新生成恢复码需要再次验证身份。</text><text x="20" y="645" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#646D68" font-weight="400">由同一认证体系处理。</text><text x="20" y="752" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#646D68" font-weight="400">站点名称</text><rect x="20" y="778" width="350" height="46" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="32" y="791" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">Personal Space</text></svg>