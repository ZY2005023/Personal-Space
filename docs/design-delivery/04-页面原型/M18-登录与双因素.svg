<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><title>M18-登录与双因素</title><rect x="0" y="0" width="390" height="1040" rx="0" fill="#F7F6F2"/><text x="24" y="22" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#252D2B" font-weight="700">Personal Space</text><text x="322" y="24" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">菜单</text><line x1="24" y1="72" x2="366" y2="72" stroke="#DADDD5" stroke-width="1"/><rect x="24" y="170" width="342" height="660" rx="10" fill="#FFFFFF" stroke="#DADDD5"/><text x="48" y="202" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#252D2B" font-weight="700">进入管理空间</text><text x="48" y="254" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#646D68" font-weight="400">第二步 · 验证身份</text><text x="48" y="310" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">输入验证器中的六位验证码。也可以使用一</text><text x="48" y="339" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">次性恢复码。</text><text x="48" y="420" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#646D68" font-weight="400">验证码</text><rect x="48" y="446" width="294" height="46" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="60" y="459" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">0 0 0 0 0 0</text><rect x="48" y="548" width="294" height="44" rx="6" fill="#245744"/><text x="64" y="559" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400">验证并登录</text><text x="48" y="626" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#245744" font-weight="400">使用恢复码</text><text x="48" y="736" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#646D68" font-weight="400">验证失败时保留输入，提示重新尝试。</text></svg>