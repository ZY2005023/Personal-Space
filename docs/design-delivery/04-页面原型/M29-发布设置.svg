Hei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">笔记，思考</text><text x="20" y="490" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#646D68" font-weight="400">发布地址</text><rect x="20" y="516" width="350" height="46" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="32" y="529" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">/knowledge/notes</text><text x="20" y="590" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#646D68" font-weight="400">摘要</text><rect x="20" y="616" width="350" height="46" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="32" y="629" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">让记录之间形成连接。</text><text x="20" y="704" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#646D68" font-weight="400">封面（可选）</text><rect x="20" y="740" width="128" height="44" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="36" y="751" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">选择媒体</text><text x="20" y="812" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#646D68" font-weight="400">设置随草稿保存，确认发布后才生效。</text><rect x="20" y="880" width="170" height="44" rx="6" fill="#245744"/><text x="36" y="891" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400">保存并检查</text></svg>