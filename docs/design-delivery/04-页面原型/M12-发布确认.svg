<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><title>M12-发布确认</title><rect x="0" y="0" width="390" height="1040" rx="0" fill="#F7F6F2"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#FFFFFF"/><line x1="20" y1="24" x2="40" y2="24" stroke="#252D2B" stroke-width="2"/><line x1="20" y1="31" x2="40" y2="31" stroke="#252D2B" stroke-width="2"/><line x1="20" y1="38" x2="40" y2="38" stroke="#252D2B" stroke-width="2"/><text x="64" y="20" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#252D2B" font-weight="700">内容管理</text><line x1="0" y1="64" x2="390" y2="64" stroke="#DADDD5" stroke-width="1"/><rect x="20" y="100" width="350" height="810" rx="10" fill="#FFFFFF" stroke="#DADDD5"/><text x="44" y="128" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#252D2B" font-weight="700">确认发布</text><text x="44" y="188" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">将已保存的草稿更新为正式版本。发布前请再</text><text x="44" y="217" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#646D68" font-weight="400">次核对可见性和地址。</text><text x="44" y="284" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#646D68" font-weight="400">内容</text><text x="44" y="312" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#252D2B" font-weight="400">如何建立可回访的笔记</text><text x="44" y="376" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#646D68" font-weight="400">可见性</text><text x="44" y="404" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#252D2B" font-weight="700">公开</text><text x="44" y="468" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#646D68" font-weight="400">目标地址</text><text x="44" y="496" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#252D2B" font-weight="400">/knowledge/notes</text><text x="44" y="560" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#646D68" font-weight="400">版本确认</text><text x="44" y="588" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#252D2B" font-weight="400">草稿 v8  →  线上第 2 版</text><text x="44" y="652" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#646D68" font-weight="400">图片状态</text><text x="44" y="680" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#252D2B" font-weight="400">全部处理完成</text><rect x="44" y="741" width="302" height="54" rx="6" fill="#E7EDE6"/><text x="58" y="756" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#245744" font-weight="400">发布后将更新公开内容与搜索结果。</text><rect x="44" y="834" width="132" height="44" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="60" y="845" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#252D2B" font-weight="400">返回编辑</text><rect x="214" y="834" width="132" height="44" rx="6" fill="#245744"/><text x="230" y="845" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400">确认发布</text></svg>