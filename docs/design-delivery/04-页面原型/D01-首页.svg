<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040"><title>D01-首页</title><rect x="0" y="0" width="1440" height="1040" rx="0" fill="#F7F6F2"/><text x="64" y="22" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#252D2B" font-weight="700">Personal Space</text><text x="998" y="27" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#252D2B" font-weight="400">生活</text><text x="1070" y="27" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#252D2B" font-weight="400">知识</text><text x="1142" y="27" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#252D2B" font-weight="400">搜索</text><text x="1250" y="27" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#252D2B" font-weight="400">关于这里</text><line x1="64" y1="72" x2="1376" y2="72" stroke="#DADDD5" stroke-width="1"/><text x="180" y="150" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#245744" font-weight="400">一个人的数字花园</text><text x="180" y="202" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="48" fill="#252D2B" font-weight="700">记录生活，也整理所知。</text><text x="180" y="288" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#646D68" font-weight="400">把日常留下，把知识连接。在这里慢慢生长。</text><rect x="180" y="354" width="160" height="44" rx="6" fill="#245744"/><text x="196" y="365" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400">走进生活  →</text><rect x="360" y="354" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#DADDD5"/><text x="376" y="365" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="14" fil