          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
          - INVALID_INPUT
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - PATH_CONFLICT
          - RESOURCE_REFERENCED
          - DRAFT_CONFLICT
          - STATE_CONFLICT
          - PRECONDITION_REQUIRED
          - IDEMPOTENCY_MISMATCH
          - OPERATION_IN_PROGRESS
          - MEDIA_NOT_READY
          - REAUTH_REQUIRED
          - PAYLOAD_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - RATE_LIMITED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - FEATURE_NOT_READY
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              pointer:
                type: string
              message:
                type: string
            required:
            - pointer
            - message
      required:
      - type
      - title
      - status
      - code
      - requestId
