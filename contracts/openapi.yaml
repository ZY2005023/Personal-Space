          maxLength: 2000
        altText:
          type: string
          maxLength: 1000
      required:
      - placementId
      - mediaId
      - role
      - caption
      - altText
    PayloadInput:
      type: object
      additionalProperties: false
      properties:
        schemaVersion: &id008
          type: integer
          const: 1
        type: &id009
          type: string
          enum:
          - MOMENT
          - ARTICLE
          - ALBUM
        module: &id010
          type: string
          enum:
          - LIFE
          - KNOWLEDGE
        title: &id011
          type: string
          maxLength: 240
        summary: &id012
          type: string
          maxLength: 4000
        bodyMarkdown: &id013
          type: string
        desiredVisibility: &id014
          type: string
          enum:
          - PUBLIC
          - PRIVATE
        desiredPath: &id015
          type: string
          pattern: ^/(life|knowledge)/[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*$
          maxLength: 500
        categoryId: &id016
          anyOf:
          - *id001
          - type: 'null'
        tagIds: &id017
          type: array
          items: *id001
          uniqueItems: true
        coverMediaId: &id018
          anyOf:
          - *id001
          - type: 'null'
        placements: &id019
          type: array
          items:
            $ref: '#/components/schemas/Placement'
