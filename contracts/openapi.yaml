      - type
      - module
      - title
      - summary
      - bodyMarkdown
      - desiredVisibility
      - desiredPath
      - categoryId
      - tagIds
      - coverMediaId
      - placements
      allOf: &id020
      - if:
          properties:
            type:
              enum:
              - MOMENT
              - ALBUM
          required:
          - type
        then:
          properties:
            module:
              const: LIFE
    TaxonomySnapshot:
