openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Personal Space V1.0 API
  version: 1.0.1
  description: '2026-11-02 设计交付契约；不是已运行服务。Auth.js提供方端点不由业务API重建。所有x-contract-rules为规范性规则。

    2026-11-02 技术修订：503未就绪响应与稳定版会话cookie逻辑名称。原冻结文件保留。本契约仍描述完整V1目标，不表示当前实现全部覆盖。'
servers:
- url: /api/v1
  description: 同源相对前缀，无部署地址
tags:
- name: 公开
- name: 管理
security: []
x-contract-rules:
  baseline: 最终冻结记录优先；字段、路径及验证参数为交付细化，见01/02/04/05。
  authentication: 同一Auth.js会话；业务API拒绝MFA未完成会话。写操作同源Origin及X-CSRF-Token检查，敏感任务需短时重新认证。逻辑cookie名需IV-01映射，不能据此另建认证。
  etag: draft ETag为强引用如"d-<contentId>-<revisionNumber>"；state ETag如"s-<contentId>-<stateVersion>"；分类/标签/设置ETag基于规范表示SHA256。GET返回ETag或明确响应字段。拒绝弱ETag与通配符。
  publish: If-Match为draft.etag，expectedStateEtag为state.stateEtag；缺少任一发布条件428（优先于一般输入验证），不匹配412；成功原子推进草稿与状态版本。标题纯空白422；ARTICLE/MOMENT正文不得空；ALBUM至少一张ALBUM_PHOTO。
  payload: type/module创建后不可变。placements中placementId唯一；coverMediaId必须有唯一COVER项；原文图片用受控placement标识解析。数组下标为排序来源。taxonomySnapshot只读，由服务端补齐。desiredPath前缀匹配module且不占系统路径。所有引用资源存在且可用。
  idempotency: 同管理员+方法+规范路径+键限定范围；摘要包含body及条件。已完成同键同参先重放再检查过期版本，但先重新鉴权；同键异参409，处理中409。默认保留24h。客户端超时使用原键和原请求重试。
  visibility: 所有公开响应只来自当前指针且实时检查PUBLISHED/PUBLIC/未删除。旧路径先授权后重定向；匿名无权404。转私密/撤回/软删除立即拒绝新的匿名请求；不能等outbox缓存清除。
  cache: 公开正文/派生媒体以及后台响应采用private,no-store的保守交付设计；不提供可绕过撤销检查的静态对象地址。缓存性能优化必须满足IV-04。
  pagination: 列表data数组+meta(nextCursor,hasMore)，cursor为绑定筛选与排序的不透明值；无效或筛选改变400；最后nextCursor=null/hasMore=false。管理列表updatedAt
    DESC/id DESC，历史versionNumber DESC，其他列表createdAt DESC/id DESC；分类sortOrder ASC/id ASC。
  serialization: 日期RFC3339 UTC，UUID字符串，API camelCase，DB snake_case；额外JSON字段422；空白搜索400；业务约束错误422。成功200/201/202包data（列表另meta）；204/308及二进制例外。
  pending: IV-01 Auth.js精确配置与敏感动作集成；IV-02 PG/Prisma约束；IV-03搜索；IV-04权限/缓存；IV-05设备；IV-06并发/租约；IV-07备份参数；IV-08媒体限额/性能/无障碍。
paths:
  /contents:
    get:
      operationId: listPublicContents
      summary: 公开内容列表
      description: 只读有效公开版本；发布时间 DESC、ID DESC 稳定游标。
      tags:
      - 公开
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentSummary'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - &id002
        name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - MOMENT
          - ARTICLE
          - ALBUM
      - &id003
        name: module
        in: query
        required: false
        schema:
          type: string
          enum:
          - LIFE
          - KNOWLEDGE
      - &id004
        name: categoryId
        in: query
        required: false
        schema: &id001
          type: string
          format: uuid
      - &id005
        name: tagId
        in: query
        required: false
        schema: *id001
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /contents/{contentId}:
    get:
      operationId: getPublicContent
      summary: 公开详情
      description: 公开详情
      tags:
      - 公开
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/PublishedContent'
                required:
                - data
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - name: contentId
        in: path
        required: true
        schema: *id001
  /search:
    get:
      operationId: searchPublicContents
      summary: 中文公开搜索
      description: 空白关键词400；只检索有效公开版本。相关性降序、发布时间降序、ID降序。短词策略IV-03。
      tags:
      - 公开
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentSummary'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - *id002
      - *id003
      - *id004
      - *id005
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /categories:
    get:
      operationId: listPublicCategories
      summary: 有公开内容的分类
      description: 有公开内容的分类
      tags:
      - 公开
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
          headers:
            ETag:
              description: 强 ETag，保存下一次条件请求使用
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /tags:
    get:
      operationId: listPublicTags
      summary: 有公开内容的标签
      description: 有公开内容的标签
      tags:
      - 公开
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
          headers:
            ETag:
              description: 强 ETag，保存下一次条件请求使用
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /routes/resolve:
    get:
      operationId: resolveRoute
      summary: 解析公开规范路径或旧路径
      description: 规范路径200；ALIAS在权限验证后308；私密/撤回/删除/不存在404。
      tags:
      - 公开
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/RouteResult'
                required:
                - data
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '308':
          description: 直接至同一内容当前规范路径，无重定向链
          headers:
            Location:
              required: true
              schema:
                type: string
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
          maxLength: 500
  /contents/{contentId}/placements/{placementId}/image:
    get:
      operationId: getPublicImage
      summary: 逐请求授权的公开派生图
      description: 检查当前发布快照中 placement 及有效权限；媒体原图不提供公开接口；禁止仅凭mediaId读取。受控响应 private,no-store。
      tags:
      - 公开
      security: []
      responses:
        '200':
          description: 清理敏感元数据后的派生图二进制
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - name: variant
        in: query
        required: true
        schema:
          type: string
          enum:
          - THUMBNAIL
          - DISPLAY
      - name: contentId
        in: path
        required: true
        schema: *id001
      - name: placementId
        in: path
        required: true
        schema: *id001
  /admin/contents:
    get:
      operationId: listAdminContents
      summary: 后台内容列表
      description: 后台内容列表
      tags:
      - 管理
      security:
      - adminSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSummary'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - *id002
      - *id003
      - *id004
      - *id005
      - name: deleted
        in: query
        required: false
        schema: &id006
          type: boolean
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    post:
      operationId: createContent
      summary: 创建内容与草稿
      description: MOMENT/ALBUM仅LIFE；初始PRIVATE/NEVER_PUBLISHED；空草稿由服务端建立，路径初始为模块/id。
      tags:
      - 管理
      security:
      - adminSession: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ContentAdmin'
                required:
                - data
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum:
                  - MOMENT
                  - ARTICLE
                  - ALBUM
                module:
                  type: string
                  enum:
                  - LIFE
                  - KNOWLEDGE
              required:
              - type
              - module
  /admin/contents/{contentId}:
    get:
      operationId: getAdminContent
      summary: 读取状态与工作草稿
      description: 读取状态与工作草稿
      tags:
      - 管理
      security:
      - adminSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ContentAdmin'
                required:
                - data
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - name: contentId
        in: path
        required: true
        schema: *id001
  /admin/contents/{contentId}/state:
    get:
      operationId: getContentState
      summary: 读取线上状态及ETag
      description: 读取线上状态及ETag
      tags:
      - 管理
      security:
      - adminSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ContentState'
                required:
                - data
          headers:
            ETag:
              description: 强 ETag，保存下一次条件请求使用
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - name: contentId
        in: path
        required: true
        schema: *id001
  /admin/contents/{contentId}/draft:
    get:
      operationId: getDraft
      summary: 读取工作草稿及ETag
      description: 读取工作草稿及ETag
      tags:
      - 管理
      security:
      - adminSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Draft'
                required:
                - data
          headers:
            ETag:
              description: 强 ETag，保存下一次条件请求使用
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - name: contentId
        in: path
        required: true
        schema: *id001
    put:
      operationId: saveDraft
      summary: 条件保存完整工作草稿
      description: If-Match为草稿ETag；仅草稿及引用更新。类型/模块不可通过本接口改变；placementId唯一，封面与placement对应。
      tags:
      - 管理
      security:
      - adminSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Draft'
                required:
                - data
          headers:
            ETag:
              description: 强 ETag，保存下一次条件请求使用
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '412':
          $ref: '#/components/responses/Problem412'
        '422':
          $ref: '#/components/responses/Problem422'
        '428':
          $ref: '#/components/responses/Problem428'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - name: contentId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadInput'
  /admin/contents/{contentId}/publish:
    post:
      operationId: publishContent
      summary: 双版本确认发布
      description: If-Match=draft.etag，expectedStateEtag=state.stateEtag；缺任一条件428，版本过期412。新快照与投影/路由/搜索/草稿基线原子提交；首次或更新均200。同幂等重放先于版本重查，但必须重新鉴权。
      tags:
      - 管理
      security:
      - adminSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/PublishResult'
                required:
                - data
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '412':
          $ref: '#/components/responses/Problem412'
        '422':
          $ref: '#/components/responses/Problem422'
        '428':
          $ref: '#/components/responses/Problem428'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      parameters:
      - name: contentId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishInput'
  /admin/contents/{contentId}/make-private:
    post:
      operationId: makeprivateContent
      summary: 转为私密
      description: If-Match为state.stateEtag；线上stateVersion+1，草稿不发布。restore同时将草稿desiredVisibility置PRIVATE且推进草稿版本；无效状态409。
      tags:
      - 管理
      security:
      - adminSession: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ContentAdmin'
                required:
                - data
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
