        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: next-auth 4.24.15统一会话的逻辑cookie名称。生产HTTPS前缀由提供方管理，业务通过getServerSession读取，不硬编码cookie。MFA与会话撤销仍需真实集成验证。
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: 强 ETag；禁止 * 和弱 ETag。草稿动作使用 draft ETag，状态动作用 state ETag。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: 同键同参重放；同键异参 409。保留24h为交付参数。
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: 由同一 Auth.js 会话体系签发/验证的 CSRF 证明。
    Reauth:
      name: X-Reauth-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Auth.js 统一体系敏感操作短时重新认证证明；具体载体 IV-01 验证。
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Problem400:
      description: 输入格式错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem401:
      description: 会话无效或MFA未完成
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: 无权限、CSRF失败或需要重新认证
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: 不存在或不可公开
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: 业务冲突或重复键异参
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem412:
      description: 条件版本已过期
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem413:
      description: 上传超限
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem415:
      description: 不支持的媒体
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem422:
      description: 结构正确但业务校验失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem428:
      description: 缺少条件版本
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: 速率限制
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: 等待秒数
    Problem500:
      description: 服务端错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem503:
      description: 基础服务不可用或目标模块尚未接通；当前实现覆盖范围见docs/IMPLEMENTATION.md
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
