openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Personal Space Auth.js安全集成扩展
  version: 0.3.0
  description: 复用同一Auth.js会话与业务CSRF校验，不提供第二套登录或注册。此文件记录提供方命名空间下的应用安全扩展；不重定义Auth.js自身端点。仅代码/替身验证，真实账号和数据库尚未初始化。
servers:
- url: /api/auth/security
security:
- adminSession: []
paths:
  /reauthenticate:
    post:
      operationId: reauthenticateAdmin
      description: 验证当前密码与第二因素，签发5分钟的限定操作一次性证明
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticateInput'
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/ReauthenticateResult'
                required:
                - data
        '400':
          description: 请求失败；不返回凭据或内部细节
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 会话无效或密码/因素验证失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: CSRF失败或证明无效/过期/已用/范围不匹配
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 请求失败；不返回凭据或内部细节
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 请求失败；不返回凭据或内部细节
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 请求失败；不返回凭据或内部细节
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 持续限流，重试不清除次数
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 请求失败；不返回凭据或内部细节
