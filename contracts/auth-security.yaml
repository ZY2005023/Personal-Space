components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: next-auth 4.24.15统一会话的逻辑cookie名称。生产HTTPS前缀由提供方管理，业务通过getServerSession读取，不硬编码cookie。MFA与会话撤销仍需真实集成验证。
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
          - INVALID_INPUT
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - PATH_CONFLICT
          - RESOURCE_REFERENCED
          - DRAFT_CONFLICT
          - STATE_CONFLICT
          - PRECONDITION_REQUIRED
          - IDEMPOTENCY_MISMATCH
          - OPERATION_IN_PROGRESS
          - MEDIA_NOT_READY
          - REAUTH_REQUIRED
          - PAYLOAD_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - RATE_LIMITED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - FEATURE_NOT_READY
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              pointer:
                type: string
              message:
                type: string
            required:
            - pointer
            - message
      required:
      - type
      - title
      - status
      - code
      - requestId
    ReauthenticateInput:
      type: object
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: &id001
          - PASSWORD_CHANGE
          - MFA_REPLACE
          - RECOVERY_RESET
          - SESSIONS_REVOKE
          - EXPORT_CREATE
          - BACKUP_CREATE
        password:
          type: string
          minLength: 1
          maxLength: 1024
        code:
          type: string
          minLength: 1
          maxLength: 128
        recovery:
          type: boolean
      required:
      - operation
      - password
      - code
      - recovery
    ReauthenticateResult:
      type: object
      additionalProperties: false
      properties:
        token: &id002
          type: string
          pattern: ^[a-f0-9]{64}$
        operation:
          type: string
          enum: *id001
        expiresAt: &id003
          type: string
          format: date-time
      required:
      - token
      - operation
      - expiresAt
    ProofInput:
      type: object
      additionalProperties: false
      properties:
        token: *id002
      required:
      - token
    PasswordInput:
      type: object
      additionalProperties: false
      properties:
        token: *id002
        newPassword:
          type: string
          description: 15至128个Unicode码点，保留空格，不允许NUL；服务端按码点计数。
      required:
      - token
      - newPassword
    MfaConfirmInput:
      type: object
      additionalProperties: false
      properties:
        bindingToken: *id002
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - bindingToken
      - code
    RevokedResult:
      type: object
      additionalProperties: false
      properties:
        sessionsRevoked:
          type: boolean
          const: true
      required:
      - sessionsRevoked
    RecoveryResult:
      type: object
      additionalProperties: false
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-f0-9]{4}(?:-[a-f0-9]{4}){7}$
        sessionsRevoked:
          type: boolean
          const: true
      required:
      - recoveryCodes
      - sessionsRevoked
    EnrollmentResult:
      type: object
      additionalProperties: false
      properties:
        bindingToken: *id002
        secret:
          type: string
          description: 仅返回给当前管理员，手动添加到验证器；不记录到审计。
        uri:
          type: string
          description: otpauth URI，仅用于验证器配置，不是登录链接。
        expiresAt: *id003
      required:
      - bindingToken
      - secret
      - uri
      - expiresAt
    MfaCancelInput:
      type: object
      additionalProperties: false
      properties:
        bindingToken:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - bindingToken
    CancelledResult:
      type: object
      additionalProperties: false
      properties:
        cancelled:
          type: boolean
          const: true
      required:
      - cancelled
    RecoveryMfaStartInput:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - password
